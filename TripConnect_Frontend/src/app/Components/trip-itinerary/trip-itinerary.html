<div>
  <h3 class="text-[17px] font-bold mb-6">Itinerary Preview</h3>
  <div class="relative ml-4 space-y-7 pb-4 max-h-[220px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;">
    <!-- Timeline Vertical Line Background -->
    <div class="absolute left-[3px] top-4 bottom-4 w-px bg-gray-200"></div>

    <div *ngFor="let item of itinerary" class="relative pl-6">
       <!-- Node Dot -->
       <div class="absolute -left-1.5 top-[18px] w-3 h-3 bg-gray-300 rounded-full border-[2.5px] border-white z-10 box-content"></div>
       <div class="flex gap-4 items-center">
          <img [src]="item.image" class="w-[52px] h-[52px] rounded-[10px] object-cover shadow-sm bg-gray-50 flex-shrink-0">
          <div>
            <h4 class="font-bold text-[14px] text-gray-900 mb-0.5">{{ item.day }}</h4>
            <p class="text-[12px] text-gray-500 font-medium">{{ item.dateString }}</p>
          </div>
       </div>
    </div>
  </div>
</div>
