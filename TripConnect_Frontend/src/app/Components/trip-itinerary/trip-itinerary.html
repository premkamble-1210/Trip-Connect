<div>
  <h3 class="text-[17px] font-bold mb-5 text-gray-900">Itinerary Preview</h3>

  <div class="relative overflow-y-auto max-h-[400px] pr-1"
       style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;">

    <!-- Gradient route line -->
    <div class="absolute left-[13px] top-5 w-[2px] rounded-full opacity-50 z-0"
         style="background: linear-gradient(to bottom, #10b981, #417cca, #6366f1); height: calc(100% - 40px);"></div>

    <div *ngFor="let item of displayItinerary; let i = index; let first = first; let last = last"
         class="itinerary-item relative flex items-start gap-3 mb-2 cursor-default">

      <!-- Numbered route node -->
      <div class="node relative z-20 flex-shrink-0 w-[28px] h-[28px] mt-[14px] rounded-full
                  flex items-center justify-center text-[11px] font-bold text-white shadow-sm"
           [ngClass]="first ? 'bg-emerald-500' : last ? 'bg-indigo-500' : 'bg-[#417cca]'">
        {{ i + 1 }}
      </div>

      <!-- Card -->
      <div class="itinerary-card flex-1 rounded-[14px] bg-white relative z-10">

        <!-- Image + info row -->
        <div class="flex items-center gap-3 p-3 rounded-t-[14px]">

          <!-- Thumbnail -->
          <div class="flex-shrink-0 w-[52px] h-[52px] rounded-[10px] overflow-hidden bg-gray-100">
            <img [src]="item.image || 'https://picsum.photos/seed/' + i + '/120/120'"
                 class="w-full h-full object-cover">
          </div>

          <!-- Text info -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-1 min-w-0">
                <span class="text-[12px] leading-none flex-shrink-0">📍</span>
                <span class="text-[13px] font-bold text-gray-900 truncate">
                  {{ item.location || item.day }}
                </span>
              </div>
              <span class="text-[10px] font-medium text-gray-400 flex-shrink-0 mt-px">
                {{ item.dateString }}
              </span>
            </div>

            <div class="flex items-center gap-2 mt-1">
              <p *ngIf="item.location" class="text-[11px] font-semibold" style="color: #417cca;">
                {{ item.day }}
              </p>
              <span *ngIf="first"
                    class="text-[9px] font-bold tracking-wide text-emerald-700 bg-emerald-50 px-1.5 py-[2px] rounded-full leading-none">
                DEPARTURE
              </span>
              <span *ngIf="last"
                    class="text-[9px] font-bold tracking-wide text-indigo-700 bg-indigo-50 px-1.5 py-[2px] rounded-full leading-none">
                ARRIVAL
              </span>
            </div>
          </div>

        </div>

        <!-- Description panel -->
        <div class="desc-panel bg-white border-t border-gray-100 rounded-b-[14px]">
          <p class="text-[11px] text-gray-500 leading-relaxed mx-3 pb-3 pt-2">
            {{ item.description }}
          </p>
        </div>

      </div>
    </div>

  </div>
</div>
