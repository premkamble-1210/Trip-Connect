<div>
  <h3 class="font-display text-[19px] font-semibold text-ink mb-5">Itinerary</h3>

  <div class="relative overflow-y-auto max-h-[400px] pr-1"
       style="scrollbar-width: thin; scrollbar-color: #a8cfcd transparent;">

    <!-- Route line -->
    <div class="absolute left-[13px] top-5 w-[2px] rounded-full opacity-60 z-0"
         style="background: linear-gradient(to bottom, #5c7a02, #0e7c7b, #e76f51); height: calc(100% - 40px);"></div>

    <div *ngFor="let item of displayItinerary; let i = index; let first = first; let last = last"
         class="itinerary-item relative flex items-start gap-3 mb-2 cursor-default">

      <!-- Numbered route node -->
      <div class="node relative z-20 flex-shrink-0 w-[28px] h-[28px] mt-[14px] rounded-full
                  flex items-center justify-center text-[11px] font-bold text-white shadow-sm"
           [ngClass]="first ? 'bg-[#0e7c7b]' : last ? 'bg-[#e76f51]' : 'bg-[#0e7c7b]/80'">
        {{ i + 1 }}
      </div>

      <!-- Card -->
      <div class="itinerary-card flex-1 rounded-xl bg-white relative z-10 border border-[#e5eae7]">

        <!-- Image + info row -->
        <div class="flex items-center gap-3 p-3 rounded-t-xl">

          <!-- Thumbnail -->
          <div class="flex-shrink-0 w-[52px] h-[52px] rounded-[10px] overflow-hidden bg-fog">
            <img [src]="item.image || 'https://picsum.photos/seed/' + i + '/120/120'"
                 class="w-full h-full object-cover">
          </div>

          <!-- Text info -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-1 min-w-0">
                <span class="text-xs leading-none flex-shrink-0">📍</span>
                <span class="text-sm font-semibold text-ink truncate">
                  {{ item.location | texttail :10 }}
                </span>
              </div>
              <span class="text-xs font-medium text-[#6b807c] flex-shrink-0 mt-px">
                {{ item.dateString }}
              </span>
            </div>

            <div class="flex items-center gap-2 mt-1">
              <p *ngIf="item.location" class="text-xs font-semibold text-wave">
                {{ item.day }}
              </p>
              <span *ngIf="first"
                    class="text-[10px] font-bold tracking-wide text-reed bg-reed-light px-1.5 py-[2px] rounded-full leading-none">
                DEPARTURE
              </span>
              <span *ngIf="last"
                    class="text-[10px] font-bold tracking-wide text-[#c9583e] bg-[#fde8df] px-1.5 py-[2px] rounded-full leading-none">
                ARRIVAL
              </span>
            </div>
          </div>

        </div>

        <!-- Description panel -->
        <div class="desc-panel bg-white border-t border-[#eff1ee] rounded-b-xl">
          <p class="text-xs text-[#5a6f6c] leading-relaxed mx-3 pb-3 pt-2">
            {{ item.description }}
          </p>
        </div>

      </div>
    </div>

  </div>
</div>
