<div>
  <h3 class="text-[17px] font-bold mb-6">Member list</h3>
  <div class="space-y-[22px] max-h-[220px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;">
    <div *ngFor="let member of members" class="flex items-center gap-3.5">
      <img [src]="member.avatar" class="w-[42px] h-[42px] rounded-full object-cover shadow-sm">
      <div>
        <a [routerLink]="['/user', member.userId]" class="font-bold text-[14px] text-gray-900 leading-tight mb-0.5 hover:underline cursor-pointer block">{{ member.name }}</a>
        <p class="text-[12px] text-blue-500 font-medium">{{ member.role }}</p>
      </div>
    </div>
  </div>
</div>
