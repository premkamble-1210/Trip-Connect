<div class="flex items-center space-x-1 sm:space-x-2">
  <!-- Notification Bell -->
  <button type="button" class="relative p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none ml-2 transition-colors">
    <span class="sr-only">View notifications</span>
    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <!-- Red dot badge -->
    <span class="absolute top-1 right-1 flex items-center justify-center h-[14px] w-[14px] rounded-full bg-red-500 ring-2 ring-white text-[9px] font-bold text-white">
      1
    </span>
  </button>

  <!-- Profile dropdown -->
  <div class="relative flex items-center cursor-pointer ml-1 pl-2">
    <img class="h-8 w-8 rounded-full object-cover border border-gray-200 shadow-sm" 
          [src]="userAvatar()" 
          alt="User Avatar">
    <!-- <svg class="ml-1 h-3 w-3 text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg> -->
  </div>
</div>
