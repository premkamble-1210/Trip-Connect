<a [routerLink]="[route]"
   routerLinkActive="border-wave text-ink"
   [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', fragment: 'ignored', matrixParams: 'ignored' }"
   class="inline-flex items-center px-1 pt-1 border-b-[3px] text-sm font-semibold transition-colors mt-[1.5px] border-transparent text-[#6b807c] hover:border-[#a8cfcd] hover:text-ink">
  {{ label }}
</a>
