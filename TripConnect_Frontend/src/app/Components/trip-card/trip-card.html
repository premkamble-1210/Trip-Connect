<div class="bg-white rounded-[20px] shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-lg transition-shadow duration-300 h-full">
  <!-- Image Header -->
  <div class="relative h-44 w-full">
    <img [src]="trip.image" [alt]="trip.title" class="w-full h-full object-cover">
    
    <!-- Badges -->
    <div *ngIf="trip.isNew" class="absolute top-3 left-3 bg-yellow-100/90 backdrop-blur-sm text-yellow-800 text-[10px] font-bold px-2 py-1 rounded shadow-sm">
      New
    </div>
    
    <!-- Heart Icon -->
    <button class="absolute top-3 right-3 p-1.5 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-white/40 hover:text-red-500 transition-colors">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </div>

  <!-- Content -->
  <div class="p-4 flex flex-col flex-grow">
    <h3 class="font-bold text-gray-900 text-[15px] truncate mb-1 leading-tight">{{ trip.title }}</h3>
    <p class="text-[11px] text-gray-500 mb-1.5">{{ trip.dates }}</p>
    <p class="text-[11px] font-semibold text-green-600 mb-4">{{ trip.status }}</p>
    
    <div class="mt-auto flex items-center justify-between">
      <!-- Avatars -->
      <div class="flex -space-x-1.5 align-middle">
        <img *ngFor="let avatar of trip.avatars; let i = index" 
             [src]="avatar" 
             class="w-[22px] h-[22px] rounded-full border-2 border-white object-cover" 
             [style.zIndex]="10 - i">
      </div>
      
      <!-- Price -->
      <div class="font-extrabold text-gray-900 text-sm">
        ₹{{ trip.price | number:'1.0-0' }}
      </div>
    </div>
  </div>
</div>
