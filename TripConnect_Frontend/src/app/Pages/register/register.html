<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4 py-10">
  <div class="max-w-xl w-full bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20">
    <div class="p-8 sm:p-10">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Create an Account</h2>
        <p class="text-indigo-100/80 text-sm">Join us today! Please fill in your details.</p>
      </div>

      <form class="space-y-5">
        <!-- 2 Column Grid for Name and Username -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <!-- Name Input -->
          <div>
            <label for="name" class="block text-sm font-medium text-white/90 mb-2">Name</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
              </div>
              <input id="name" name="name" type="text" required 
                class="block w-full pl-11 pr-4 py-3 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
                placeholder="Full name">
            </div>
          </div>

          <!-- Username Input -->
          <div>
            <label for="username" class="block text-sm font-medium text-white/90 mb-2">Username</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd" />
                </svg>
              </div>
              <input id="username" name="username" type="text" required 
                class="block w-full pl-11 pr-4 py-3 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
                placeholder="Username">
            </div>
          </div>
        </div>

        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-white/90 mb-2">Email Address</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input id="email" name="email" type="email" required 
              class="block w-full pl-11 pr-4 py-3 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
              placeholder="you@example.com">
          </div>
        </div>

        <!-- Phone Input -->
        <div>
          <label for="phone" class="block text-sm font-medium text-white/90 mb-2">Phone Number</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
              </svg>
            </div>
            <input id="phone" name="phone" type="tel" required 
              class="block w-full pl-11 pr-4 py-3 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
              placeholder="+1 (555) 000-0000">
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-white/90 mb-2">Password</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input id="password" name="password" type="password" required 
              class="block w-full pl-11 pr-4 py-3 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
              placeholder="Create a strong password">
          </div>
        </div>

        <!-- Register Button -->
        <div class="pt-4">
          <button type="button" 
            class="w-full flex justify-center items-center py-3.5 px-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] text-sm font-bold text-indigo-600 bg-white hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-indigo-500 focus:ring-white transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-lg active:scale-[0.98]">
            Create Account
            <svg class="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
