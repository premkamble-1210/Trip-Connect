<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3 md:gap-4 w-full">
  <!-- Trip Card -->
  <div class="border border-[#d9e1df] rounded-xl p-2 sm:p-3 bg-white transition-all hover:shadow-md hover:border-wave/40" *ngFor="let trip of trips">
    <!-- Trip Header -->
    <div class="flex justify-between items-start gap-2 mb-2 sm:mb-3">
      <h3 class="font-display text-sm font-semibold text-ink m-0 flex-1">{{ trip.title }}</h3>
      <span class="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap"
        [ngClass]="trip.status.toLowerCase() === 'upcoming' ? 'bg-wave-light text-wave' :
                   trip.status.toLowerCase() === 'completed' ? 'bg-reed-light text-reed' :
                   'bg-[#fde8df] text-coral'">
        {{ trip.status }}
      </span>
    </div>

    <!-- Trip Details -->
    <div class="mb-2 sm:mb-3">
      <div class="flex justify-between items-center py-0.5 sm:py-1 px-0 text-xs border-b border-[#e5eae7]">
        <span class="text-ink-soft font-medium">📍 Location:</span>
        <span class="text-ink font-semibold">{{ trip.location }}</span>
      </div>
      <div class="flex justify-between items-center py-0.5 sm:py-1 px-0 text-xs border-b border-[#e5eae7]">
        <span class="text-ink-soft font-medium">📅 Dates:</span>
        <span class="text-ink font-semibold">{{ trip.startDate | date:'MMM d' }} – {{ trip.endDate | date:'MMM d, yyyy' }}</span>
      </div>
      <div class="flex justify-between items-center py-0.5 sm:py-1 px-0 text-xs border-b border-[#e5eae7]">
        <span class="text-ink-soft font-medium">💰 Budget:</span>
        <span class="text-ink font-semibold">{{ trip.budget }}</span>
      </div>
      <div class="flex justify-between items-center py-0.5 sm:py-1 px-0 text-xs">
        <span class="text-ink-soft font-medium">👥 Seats:</span>
        <span class="text-ink font-semibold">{{ trip.seats }}</span>
      </div>
    </div>

    <!-- Travel Type -->
    <div class="flex items-center gap-2 py-1.5 sm:py-2 px-0 border-b border-[#d9e1df] text-xs text-ink-soft mb-2 sm:mb-3">
      <span class="text-xs">🧭 {{ trip.travelType }}</span>
    </div>

    <!-- Actions (Read-Only) -->
    <div class="flex gap-1 sm:gap-2">
      <button class="w-full py-1.5 sm:py-2 px-2 sm:px-3 bg-[#c5d1cd] text-white text-xs font-semibold rounded-lg cursor-not-allowed opacity-70" disabled title="Read-only view">
        🔒 View Trip Details
      </button>
    </div>
  </div>
</div>
