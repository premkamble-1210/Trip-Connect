<!-- Tabs Section -->
<div class="flex-1 min-w-0 bg-white rounded-lg overflow-hidden shadow-sm flex flex-col max-h-screen lg:max-h-96 xl:max-h-full">
  <!-- Tab Buttons -->
  <div class="flex w-full border-b-2 border-gray-200 bg-gray-50 flex-shrink-0">
    <button 
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'hosted' ? 'text-blue-600 border-blue-600 bg-white' : 'text-gray-600 border-transparent bg-gray-50 hover:text-gray-800 hover:bg-gray-100'"
      (click)="setActiveTab('hosted')">
      Hosted Trips
    </button>
    <button 
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'joined' ? 'text-blue-600 border-blue-600 bg-white' : 'text-gray-600 border-transparent bg-gray-50 hover:text-gray-800 hover:bg-gray-100'"
      (click)="setActiveTab('joined')">
      Joined Trips
    </button>
    <button 
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'reviews' ? 'text-blue-600 border-blue-600 bg-white' : 'text-gray-600 border-transparent bg-gray-50 hover:text-gray-800 hover:bg-gray-100'"
      (click)="setActiveTab('reviews')">
      Reviews
    </button>
  </div>
  
  <!-- Tab Content -->
  <div class="p-2 sm:p-3 md:p-4 flex-1 overflow-y-auto">
    <div *ngIf="activeTab === 'hosted'" class="animate-fadeIn">
      <app-view-hosted-trips></app-view-hosted-trips>
    </div>
    <div *ngIf="activeTab === 'joined'" class="animate-fadeIn">
      <app-joined-trips></app-joined-trips>
    </div>
    <div *ngIf="activeTab === 'reviews'" class="animate-fadeIn">
      <app-reviews></app-reviews>
    </div>
  </div>
</div>
