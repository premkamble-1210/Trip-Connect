<!-- Tabs Section -->
<div class="flex-1 min-w-0 bg-paper rounded-2xl overflow-hidden shadow-sm flex flex-col border border-[#e5eae7]">
  <!-- Tab Buttons -->
  <div class="flex w-full border-b-2 border-[#e5eae7] bg-fog flex-shrink-0">
    <button
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'hosted' ? 'text-wave border-wave bg-paper' : 'text-ink-soft border-transparent bg-fog hover:text-ink hover:bg-[#e2e8e5]'"
      (click)="setActiveTab('hosted')">
      Hosted Trips
    </button>
    <button
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'joined' ? 'text-wave border-wave bg-paper' : 'text-ink-soft border-transparent bg-fog hover:text-ink hover:bg-[#e2e8e5]'"
      (click)="setActiveTab('joined')">
      Joined Trips
    </button>
    <button
      class="flex-1 min-w-fit px-2 sm:px-3 md:px-5 py-2 sm:py-3 md:py-4 border-b-4 transition-all text-xs sm:text-sm font-semibold cursor-pointer"
      [ngClass]="activeTab === 'reviews' ? 'text-wave border-wave bg-paper' : 'text-ink-soft border-transparent bg-fog hover:text-ink hover:bg-[#e2e8e5]'"
      (click)="setActiveTab('reviews')">
      Reviews
    </button>
  </div>

  <!-- Tab Content -->
  <div class="flex-1 overflow-hidden flex flex-col">
    <div *ngIf="activeTab === 'hosted'" class="animate-fadeIn flex-1 overflow-y-auto p-2 sm:p-3 md:p-4">
      <app-hosted-trips></app-hosted-trips>
    </div>
    <div *ngIf="activeTab === 'joined'" class="animate-fadeIn flex-1 overflow-y-auto p-2 sm:p-3 md:p-4">
      <app-joined-trips></app-joined-trips>
    </div>
    <div *ngIf="activeTab === 'reviews'" class="animate-fadeIn flex-1 overflow-y-auto p-2 sm:p-3 md:p-4">
      <app-reviews></app-reviews>
    </div>
  </div>
</div>
