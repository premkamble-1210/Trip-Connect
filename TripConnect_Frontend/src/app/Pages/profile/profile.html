<div class="flex flex-col lg:flex-row gap-3 md:gap-4 p-2 sm:p-3 md:p-4 bg-gray-100 min-h-screen w-full box-border" *ngIf="user">
  <!-- Profile Card -->
  <div class="flex-shrink-0 w-full lg:w-72 bg-white rounded-lg p-3 sm:p-4 md:p-5 shadow-sm lg:sticky lg:top-5 h-fit">
    <!-- Profile Header -->
    <div class="text-center mb-3 sm:mb-4 md:mb-5">
      <div class="relative w-fit mx-auto">
        <img [src]="user.avatarUrl || 'https://ui-avatars.com/api/?name=' + user.name" [alt]="user.name" class="w-24 sm:w-28 md:w-32 h-24 sm:h-28 md:h-32 rounded-full object-cover border-4 border-gray-200 shadow-md">
        <button class="absolute bottom-0 right-0 w-7 sm:w-8 md:w-9 h-7 sm:h-8 md:h-9 rounded-full bg-blue-600 border-4 border-white text-white cursor-pointer flex items-center justify-center hover:bg-blue-700 transition-all shadow-md" (click)="openEditModal()" title="Edit contact info">
          <span class="font-bold text-base">✎</span>
        </button>
      </div>
    </div>

    <!-- Profile Info -->
    <div>
      <h2 class="text-base sm:text-lg font-semibold text-gray-900 m-0 my-2 sm:my-4">{{ user.name }}</h2>
      <p class="text-gray-600 text-xs sm:text-sm mb-2">@{{ user.username }}</p>

      <!-- Rating -->
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="text-yellow-400 text-xs sm:text-sm">{{ renderStars(user.averageRating) }}</span>
        <span class="font-semibold text-gray-900 text-xs sm:text-sm">{{ user.averageRating }} <span class="text-gray-500 font-normal">• {{ user.totalRatings }} reviews</span></span>
      </div>

      <p class="text-gray-600 text-xs mb-3 sm:mb-4">Member Since: {{ user.createdAt | date:'MMMM yyyy' }}</p>

      <!-- Contact Info -->
      <div class="border-t border-b border-gray-200 py-2 sm:py-3 mb-3 sm:mb-4">
        <h3 class="text-xs font-semibold text-gray-900 mb-2 uppercase">Contact Info</h3>
        <p class="text-xs text-gray-600 my-1"><strong>Email:</strong> <span class="text-gray-900">{{ user.email }}</span></p>
        <p class="text-xs text-gray-600"><strong>Phone:</strong> <span class="text-gray-900">{{ user.phone }}</span></p>
      </div>

      <button class="w-full py-2 bg-white border border-gray-300 rounded-md text-gray-600 text-xs font-semibold cursor-pointer transition-all hover:border-gray-600 hover:bg-gray-50">Request Verification</button>
    </div>
  </div>

  <!-- Tabs Component -->
  <app-profile-tabs></app-profile-tabs>

  <!-- Edit Modal -->
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" *ngIf="isEditModalOpen" (click)="closeEditModal()">
    <div class="bg-white rounded-lg shadow-2xl w-11/12 sm:w-full max-w-sm" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="flex justify-between items-center p-3 sm:p-4 md:p-5 border-b border-gray-200">
        <h3 class="m-0 text-base sm:text-lg text-gray-900 font-semibold">Edit Profile</h3>
        <button class="bg-none border-none text-2xl text-gray-600 cursor-pointer p-0 w-8 h-8 flex items-center justify-center hover:text-gray-900 transition-colors" (click)="closeEditModal()">✕</button>
      </div>

      <!-- Form -->
      <form class="p-3 sm:p-4 md:p-5">
        <!-- Name Field -->
        <div class="mb-5">
          <label for="editName" class="block text-xs font-semibold text-gray-900 mb-2">Full Name</label>
          <input
            type="text"
            id="editName"
            [(ngModel)]="editForm.name"
            name="editName"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm transition-all hover:border-gray-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
            placeholder="Enter name">
        </div>

        <!-- Phone Field -->
        <div class="mb-6">
          <label for="editPhone" class="block text-xs font-semibold text-gray-900 mb-2">Phone Number</label>
          <input
            type="tel"
            id="editPhone"
            [(ngModel)]="editForm.phone"
            name="editPhone"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm transition-all hover:border-gray-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
            placeholder="Enter phone">
        </div>

        <!-- Actions -->
        <div class="flex gap-2">
          <button type="button" class="flex-1 py-2 bg-gray-100 border border-gray-300 rounded-md text-gray-600 text-xs font-semibold cursor-pointer transition-all hover:bg-gray-200 hover:border-gray-400" (click)="closeEditModal()">Cancel</button>
          <button type="button" class="flex-1 py-2 bg-blue-600 text-white text-xs font-semibold cursor-pointer rounded-md transition-all hover:bg-blue-700 hover:shadow-md" (click)="saveChanges()">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
