<div class="flex flex-col gap-3 sm:gap-4 md:gap-5 w-full">
  <!-- Review Card -->
  <div class="border border-[#d9e1df] rounded-xl p-3 sm:p-4 bg-white transition-all hover:shadow-md hover:border-wave/40" *ngFor="let review of reviews">
    <!-- Review Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-start gap-3 sm:gap-4 mb-2 sm:mb-3">
      <div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
        <img [src]="'https://ui-avatars.com/api/?name=' + review.raterUserName" [alt]="review.raterUserName" class="w-10 sm:w-12 h-10 sm:h-12 rounded-full object-cover flex-shrink-0 border border-[#e5eae7]">
        <div class="min-w-0 flex-1">
          <h4 class="text-xs sm:text-sm font-semibold text-ink m-0">{{ review.raterUserName }}</h4>
          <p class="text-xs text-ink-soft m-0">{{ review.createdAt | date:'MMMM d, yyyy' }}</p>
        </div>
      </div>
      <div class="flex flex-col items-end gap-1 flex-shrink-0">
        <span class="text-xs sm:text-sm text-yellow-400">{{ renderStars(review.rating) }}</span>
        <span class="text-xs sm:text-sm font-semibold text-ink">{{ review.rating }}</span>
      </div>
    </div>

    <!-- Trip Name -->
    <h5 class="text-xs font-semibold text-wave mb-2 m-0">{{ review.tripTitle }}</h5>

    <!-- Review Text -->
    <p class="text-xs sm:text-sm text-ink-soft mb-2 sm:mb-3 m-0 leading-6">
      {{ review.review }}
    </p>
  </div>
</div>
