<div class="min-h-screen bg-[#f4f7fb] py-6 px-4 sm:px-6 lg:px-8 max-w-screen-2xl mx-auto font-sans text-gray-800">
  
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8">
    <h1 class="text-[26px] font-bold text-gray-900 tracking-tight mb-4 sm:mb-0">Explore / Browse Trips</h1>
    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-[10px] shadow-sm transition-colors text-sm transform hover:-translate-y-0.5 ease-in-out duration-200">
      Create Trip
    </button>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    
    <!-- Sidebar Filters -->
    <div class="w-full lg:w-64 flex-shrink-0 space-y-8 pr-4">
      
      <!-- Location Filter -->
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-2.5">Location</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-[18px] w-[18px] text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </div>
          <!-- Input + Datalist for Location -->
          <input list="location-options" [value]="location()" (input)="updateLocation($event)" placeholder="Search or select a location " class="block w-full pl-9 pr-10 py-2 text-sm border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-lg bg-white border text-gray-600 shadow-sm h-10">
          <datalist id="location-options">
            <option *ngFor="let loc of locations" [value]="loc"></option>
          </datalist>
        </div>
      </div>

      <!-- Budget Filter -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-900 mb-5">Budget</label>
        <div class="px-2">
          <!-- Custom Slider track -->
          <div class="relative w-full h-[6px] bg-gray-200 rounded-full">
            <!-- Dynamic Filled Track -->
            <div class="absolute h-full bg-[#87b4ce] rounded-full pointer-events-none" 
                 [style.left.%]="(budgetMin() / 10000) * 100" 
                 [style.right.%]="100 - (budgetMax() / 10000) * 100"></div>
            
            <!-- Min Input Slider -->
            <input type="range" min="0" max="10000" step="100"
                   [value]="budgetMin()" (input)="updateBudgetMin($event)"
                   class="absolute w-full -top-[6px] h-[18px] appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-[18px] [&::-webkit-slider-thumb]:h-[18px] [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-[#87b4ce] [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:shadow-sm [&::-webkit-slider-thumb]:cursor-pointer z-20" />

            <!-- Max Input Slider -->
            <input type="range" min="0" max="10000" step="100"
                   [value]="budgetMax()" (input)="updateBudgetMax($event)"
                   class="absolute w-full -top-[6px] h-[18px] appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-[18px] [&::-webkit-slider-thumb]:h-[18px] [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-[#87b4ce] [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:shadow-sm [&::-webkit-slider-thumb]:cursor-pointer z-20" />
          </div>
          
          <div class="flex justify-between mt-4 text-[12px] text-gray-500 font-medium tracking-wide">
            <span>₹{{ budgetMin() }}</span>
            <span>₹{{ budgetMax() | number:'1.0-0' }}</span>
          </div>
        </div>
      </div>

      <!-- Dates Filter -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-900 mb-3.5">Dates</label>
        <div class="space-y-3">
          <label *ngFor="let date of datesFilter" class="flex items-center cursor-pointer group">
            <input type="checkbox" [checked]="date.checked" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
            <span class="ml-3 text-[13px] text-gray-500 group-hover:text-gray-900 transition-colors">{{ date.label }}</span>
          </label>
        </div>
      </div>

      <!-- Trip Type Filter -->
      <div>
        <label class="block text-[13px] font-semibold text-gray-900 mb-2.5">Trip Type</label>
        <div class="relative">
          <select [value]="tripType()" (change)="updateTripType($event)" class="block w-full pl-3 pr-10 py-2 text-[13px] border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-lg bg-white border text-gray-500 appearance-none shadow-sm h-10">
            <option *ngFor="let type of tripTypes" [value]="type">{{ type }}</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
             <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
          </div>
        </div>
      </div>

    </div>

    <!-- Main Content - Grid -->
    <div class="flex-1 pb-12">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @if (isLoading()) {
          <div class="col-span-full flex justify-center py-12 text-gray-400">Loading trips...</div>
        } @else if (trips().length === 0) {
          <div class="col-span-full flex justify-center py-12 text-gray-400">No trips found.</div>
        } @else {
          <app-trip-card *ngFor="let trip of trips()" [trip]="toCardTrip(trip)"></app-trip-card>
        }
      </div>
    </div>
    
  </div>
</div>
