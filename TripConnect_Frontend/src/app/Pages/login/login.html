<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4">
  <div class="max-w-md w-full bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20">
    <div class="p-8 sm:p-10">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Welcome Back</h2>
        <p class="text-indigo-100/80 text-sm">Please sign in to your account</p>
      </div>

      <form class="space-y-6">
        <!-- Username Input -->
        <div>
          <label for="username" class="block text-sm font-medium text-white/90 mb-2">Username</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
            </div>
            <input id="username" name="username" type="text" required 
              class="block w-full pl-11 pr-4 py-3.5 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
              placeholder="Enter your username">
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-white/90 mb-2">Password</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-white text-indigo-200/70">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input id="password" name="password" type="password" required 
              class="block w-full pl-11 pr-4 py-3.5 border border-white/20 rounded-2xl bg-white/10 text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300 ease-in-out backdrop-blur-md shadow-inner" 
              placeholder="Enter your password">
          </div>
        </div>

        <!-- Login Button -->
        <div class="pt-2">
          <button type="button" 
            class="w-full flex justify-center items-center py-3.5 px-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] text-sm font-bold text-indigo-600 bg-white hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-indigo-500 focus:ring-white transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-lg active:scale-[0.98]">
            Login
            <svg class="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
